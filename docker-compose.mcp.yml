# MCP de lectura sobre la misma base utilizada por la UI.
name: seguimiento-medicion-mcp
services:
  mcp:
    image: ${MCP_IMAGE:-ghcr.io/faustinoduran/seguimiento-medicion-mcp}:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      MCP_TRANSPORT: http
      PORT: "8080"
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:?MCP_PUBLIC_URL is required}
      MCP_DATABASE_URL: postgres://mcp_app_reader:${MCP_READER_PASSWORD:?MCP_READER_PASSWORD is required}@application-database:5432/${MCP_DATABASE_NAME:-seguimiento_medicion}?sslmode=disable
    ports:
      - "127.0.0.1:3008:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 15s
    networks:
      application:
        aliases: [mcp]

networks:
  application:
    external: true
    name: seguimiento-medicion-prod_default
