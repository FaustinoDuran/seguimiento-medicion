name: Frontend

on:
  push:
  pull_request:

jobs:
  test:
    name: Build, lint y tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:coverage
      - name: Publicar resumen de cobertura
        run: |
          {
            echo "### Cobertura del frontend"
            echo
            echo "El reporte de texto queda en el log de este paso y el HTML en el artefacto."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: error
