server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolución en cada solicitud: la SPA puede arrancar antes que el MCP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location = /mcp {
        set $mcp_backend http://mcp:8080;
        proxy_pass $mcp_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 90s;
    }

    location = /mcp/healthz {
        set $mcp_backend http://mcp:8080;
        proxy_pass $mcp_backend/healthz;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
